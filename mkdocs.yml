site_name: nicefigs
site_description: Publication-grade, modular matplotlib plotting for geoscience.
site_url: https://earthyscience.github.io/nicefigs/
repo_url: https://github.com/EarthyScience/nicefigs
repo_name: EarthyScience/nicefigs
docs_dir: docs

theme:
  name: material
  logo: assets/logo/nicefigs-mark.svg
  favicon: assets/logo/favicon.png
  # Light scheme only: the figures have white backgrounds.
  palette:
    scheme: default
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            docstring_section_style: table
            members_order: source
            show_if_no_docstring: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Gallery: gallery.md
  - Guide:
      - Styling & themes: guide/styling.md
      - Figures & sizing: guide/figures.md
      - Maps: guide/maps.md
      - Colormaps & palettes: guide/colormaps.md
      - Plots (images, scatter, timeseries, ...): guide/plots.md
      - Animation: guide/animation.md
  - API Reference: api.md
