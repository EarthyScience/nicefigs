name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check tag matches package version
        run: |
          version=$(grep -Po '^__version__ = "\K[^"]+' src/nicefigs/__init__.py)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match __version__ ${version}" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Check distributions
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the built wheel (not the checkout)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install "$(ls dist/*.whl)[maps,xarray]" pytest
      - name: Test against the installed wheel
        env:
          MPLBACKEND: Agg
        # Moving src/ away guarantees the tests import the installed wheel, not the checkout.
        run: |
          mv src src.unused
          .venv/bin/python -c "import nicefigs; print(nicefigs.__version__, nicefigs.__file__)"
          .venv/bin/python -m pytest -q

  publish:
    needs: test-wheel
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nicefigs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && (/^## \[/ || /^\[[^]]+\]: /) {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for ${version}" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md
