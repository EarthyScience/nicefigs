name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install with dev extras
        run: uv pip install -e ".[dev]"
      - name: Test
        env:
          MPLBACKEND: Agg
        run: uv run pytest -q

  test-minimal:
    # Core install only (no cartopy, no xarray): optional-dependency tests must skip, not fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create virtual environment
        run: uv venv --python 3.12
      - name: Install core package only
        run: uv pip install -e . pytest
      - name: Test
        env:
          MPLBACKEND: Agg
        run: uv run pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create virtual environment
        run: uv venv --python 3.12
      - name: Install with docs extras
        run: uv pip install -e ".[docs,maps,xarray]"
      - name: Run the code examples of README and docs
        env:
          MPLBACKEND: Agg
        run: uv run python scripts/docs_examples.py
      - name: Build site
        run: uv run mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Check distributions
        run: uvx twine check --strict dist/*
